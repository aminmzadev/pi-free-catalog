name: Catalog

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      bootstrap:
        description: 'First deployment ONLY: allow an HTTP 404 for the previous snapshot. All seven sources must succeed.'
        type: boolean
        default: false
      approve_large_changes:
        description: 'After reviewing a rejected candidate: approve declines exceeding 50%. Does not bypass schema/security checks.'
        type: boolean
        default: false

permissions:
  contents: read

# One workflow-wide lock includes build AND deploy. Never let an older run deploy after a newer run.
concurrency:
  group: catalog-pages
  cancel-in-progress: false

jobs:
  collect:
    if: github.repository == 'aminmzadev/pi-free-catalog' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.pages.outputs.artifact_id }}
      snapshot-sha256: ${{ steps.build.outputs.snapshot_sha256 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.0.0'
          package-manager-cache: false
      - name: Pinned runtime and repository-only syntax
        run: |
          test "$(node --version)" = 'v26.0.0'
          node ci/check.mjs
      - name: Offline collector and pipeline tests (no dependency installation or credentials)
        run: node --test ci/test/catalog*.test.mjs
      - name: Collect, reconcile and validate snapshot
        id: build
        env:
          CATALOG_BOOTSTRAP: ${{ github.event_name == 'workflow_dispatch' && inputs.bootstrap == true }}
          CATALOG_APPROVE_LARGE_CHANGES: ${{ github.event_name == 'workflow_dispatch' && inputs.approve_large_changes == true }}
        run: node ci/catalog/collect.mjs
      - name: Upload validated Pages artifact
        id: pages
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: artifacts/catalog/site
          retention-days: 7
      - name: Preserve diagnostics (never a runtime data endpoint)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: catalog-diagnostics
          path: |
            artifacts/catalog/report.json
            artifacts/catalog/failure.json
            artifacts/catalog/rejected-candidate.json
          if-no-files-found: warn
          retention-days: 14

  deploy:
    needs: collect
    if: github.repository == 'aminmzadev/pi-free-catalog' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26.0.0'
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          artifact-ids: ${{ needs.collect.outputs.artifact-id }}
          path: artifacts/catalog/download
          merge-multiple: true
          digest-mismatch: error
      - name: Verify exact artifact/hash/contract/commit before deployment (no extraction or rebuild)
        env:
          EXPECTED_SNAPSHOT_SHA256: ${{ needs.collect.outputs.snapshot-sha256 }}
        run: node ci/catalog/verify-pages.mjs
      - name: Deploy already-verified artifact
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: github-pages
          timeout: 300000
      - name: Verify public Pages bytes and snapshot after bounded propagation wait
        env:
          EXPECTED_SNAPSHOT_SHA256: ${{ needs.collect.outputs.snapshot-sha256 }}
        run: node ci/catalog/verify-live.mjs
