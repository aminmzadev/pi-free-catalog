name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify Node ${{ matrix.node }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - node: '22.19.0'
            npm: '10.9.3'
          - node: '26.0.0'
            npm: '11.12.1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - name: Check pinned toolchain
        env:
          EXPECTED_NODE: ${{ matrix.node }}
          EXPECTED_NPM: ${{ matrix.npm }}
        run: |
          test "$(node --version)" = "v$EXPECTED_NODE"
          test "$(npm --version)" = "$EXPECTED_NPM"
      - name: Lockfile install (no dependency lifecycle hooks)
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Syntax and all existing offline tests
        run: npm run verify
      - name: Automation syntax and negative/positive guard tests
        run: |
          node ci/check.mjs
          node --test ci/test/*.test.mjs
      - name: Validate workflows with pinned actionlint
        if: matrix.node == '26.0.0'
        run: node ci/lint-workflows.mjs
      - name: Build TGZ once and inspect archive
        run: node ci/pack-release.mjs
      - name: Clean customer install, real Pi loader and shipped tests
        run: node ci/test-installed.mjs
      - name: Upload verified package evidence (not a release)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ci-package-node-${{ matrix.node }}
          path: artifacts/release/
          if-no-files-found: error
          retention-days: 7
